name: Verify

# Scaffold สำหรับขั้นตอน "Verify" ใน docs/LOOP_WORKFLOW.md
# ให้ CI เป็นผู้ยืนยันหลักฐานแทนการเชื่อคำอธิบายของ AI/คนเพียงอย่างเดียว
#
# เมื่อ repo นี้เริ่มมีโค้ดจริงแล้ว ให้เลือก/แก้ไข block ด้านล่างตามเทคโนโลยีที่ใช้
# (ดูตารางใน docs/LOOP_WORKFLOW.md หัวข้อ "3) Verify") แล้วลบ block ที่ไม่ใช้ทิ้ง

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- apps/openloops (Vite + React + TypeScript PWA) ------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/openloops/package-lock.json
      - name: Install
        working-directory: apps/openloops
        run: npm ci
      - name: Typecheck
        working-directory: apps/openloops
        run: npm run typecheck
      - name: Test
        working-directory: apps/openloops
        run: npm test
      - name: Build
        working-directory: apps/openloops
        run: npm run build
